
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iManu994 – Projekte</title>
<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 50px 20px;
    font-family: Arial, sans-serif;
    background: #101827;
    color: white;
}

header {
    text-align: center;
    margin-bottom: 40px;
}

header h1 { font-size: 38px; }

header p { color: #9caec5; }

main {
    max-width: 850px;
    margin: auto;
}

#projects {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 18px;
}

.card {
    background: #1e293b;
    border: 1px solid #334155;
    padding: 22px;
    border-radius: 14px;
}

.card h2 { font-size: 20px; }

.card p {
    color: #aab9cc;
    min-height: 40px;
}

.card a {
    display: inline-block;
    background: #2563eb;
    color: white;
    padding: 11px 16px;
    border-radius: 8px;
    text-decoration: none;
}

.card a:hover { background: #1d4ed8; }

#status {
    text-align: center;
    color: #9caec5;
    margin: 30px;
}
</style>
</head>
<body>

<header>
    <h1>iManu994</h1>
    <p>Meine Projekte & Web-Anwendungen</p>
</header>

<main>
    <div id="status">Lade meine GitHub-Projekte ...</div>
    <div id="projects"></div>
</main>

<script>
async function loadProjects() {
    const status = document.getElementById("status");
    const container = document.getElementById("projects");

    try {
        const response = await fetch(
            "https://api.github.com/users/iManu994/repos?per_page=100&sort=updated"
        );

        if (!response.ok) throw new Error("GitHub API nicht erreichbar");

        const repos = await response.json();

        const projects = repos.filter(repo =>
            !repo.fork && !repo.archived
        );

        container.innerHTML = "";

        projects.forEach(repo => {
            const card = document.createElement("div");
            card.className = "card";

            const title = document.createElement("h2");
            title.textContent = repo.name;

            const description = document.createElement("p");
            description.textContent =
                repo.description || "GitHub-Projekt";

            const link = document.createElement("a");
            link.href = repo.has_pages
                ? `https://iManu994.github.io/${repo.name}/`
                : repo.html_url;

            link.textContent = repo.has_pages
                ? "Website öffnen"
                : "Repository öffnen";

            link.target = "_blank";
            link.rel = "noopener noreferrer";

            card.append(title, description, link);
            container.appendChild(card);
        });

        status.textContent =
            projects.length + " öffentliche Projekte gefunden";

    } catch (error) {
        status.textContent =
            "Projekte konnten nicht geladen werden.";
    }
}

loadProjects();
</script>

</body>
</html>
